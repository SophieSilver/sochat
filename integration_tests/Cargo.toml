[package]
name = "integration_tests"
description = "Integration and end-to-end tests for sochat client and server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
common = { version = "0.1.0", path = "../common" }
sochat_client_lib = { version = "0.1.0", path = "../client/sochat_client_lib" }
sochat_server = { version = "0.1.0", path = "../server/sochat_server" }
sqlx = { version = "0.8.6", features = ["sqlite"] }
tokio = { version = "1.46.1", features = ["macros", "rt"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
